<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Raad de 2FA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <section id="join" class="card">
      <h1>Raad de 2FA</h1>
      <p class="subtitle">Raad de 6-cijferige code en maak kans op een prijs!</p>
      <label>Je naam</label>
      <input id="name" maxlength="30" autocomplete="name" placeholder="Bijvoorbeeld Martin">
      <label>Jouw code</label>
      <input id="guess" inputmode="numeric" maxlength="6" placeholder="000000">
      <button id="joinBtn">MEEDOEN</button>
      <p id="joinMsg" class="msg"></p>
    </section>

    <section id="waiting" class="card hidden">
      <div class="lock">✅</div>
      <h1>Je doet mee!</h1>
      <p id="savedGuess"></p>
      <p>Wacht op het grote scherm...</p>
    </section>

    <section id="display" class="display hidden">
      <div class="display-inner">
        <div class="lock">🔐</div>
        <h1>RAAD DE 2FA</h1>
        <p id="displayText" class="subtitle">Doe mee via je telefoon!</p>
        <div id="timer" class="timer">30</div>
        <div id="entriesCount" class="count"></div>
        <div id="entries" class="entries"></div>
        <div id="result" class="result hidden"></div>
      </div>
    </section>

    <section id="admin" class="card hidden">
      <div class="lock">🎛️</div>
      <h1>Spelbesturing</h1>
      <p id="adminUid" class="small"></p>
      <div class="admin-grid">
        <label>Timer (seconden)</label>
        <input id="duration" type="number" min="5" max="300" value="30">
        <button id="startBtn">START RONDE</button>
        <button id="revealBtn" class="secondary">TOON CODE & WINNAAR</button>
        <button id="resetBtn" class="danger">NIEUWE RONDE</button>
      </div>
      <div id="adminStatus" class="msg"></div>
      <p class="small">Open deze pagina op het grote scherm met <code>?screen=display</code>. Deelnemers gebruiken de gewone URL.</p>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
